  <!-- PACMAN - pixel art yellow, 3px pixels, 13-wide -->
  <!-- Using a group that moves across -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-50,0;850,0" dur="4s" repeatCount="indefinite" calcMode="linear"/>
    <!-- pixel art pacman - open mouth frame -->
    <!-- Cell size: 4px. Origin offset: x-center at col 6, y-center at row 6 -->
    <!-- Rows top to bottom -->
    <g fill="#FFE000">
      <!-- row 0: cols 3-9 -->
      <rect x="12" y="6" width="4" height="4"/><rect x="16" y="6" width="4" height="4"/><rect x="20" y="6" width="4" height="4"/><rect x="24" y="6" width="4" height="4"/><rect x="28" y="6" width="4" height="4"/><rect x="32" y="6" width="4" height="4"/><rect x="36" y="6" width="4" height="4"/>
      <!-- row 1: cols 1-11 -->
      <rect x="4" y="10" width="4" height="4"/><rect x="8" y="10" width="4" height="4"/><rect x="12" y="10" width="4" height="4"/><rect x="16" y="10" width="4" height="4"/><rect x="20" y="10" width="4" height="4"/><rect x="24" y="10" width="4" height="4"/><rect x="28" y="10" width="4" height="4"/><rect x="32" y="10" width="4" height="4"/><rect x="36" y="10" width="4" height="4"/><rect x="40" y="10" width="4" height="4"/><rect x="44" y="10" width="4" height="4"/>
      <!-- row 2: cols 0-12 -->
      <rect x="0" y="14" width="4" height="4"/><rect x="4" y="14" width="4" height="4"/><rect x="8" y="14" width="4" height="4"/><rect x="12" y="14" width="4" height="4"/><rect x="16" y="14" width="4" height="4"/><rect x="20" y="14" width="4" height="4"/><rect x="24" y="14" width="4" height="4"/><rect x="28" y="14" width="4" height="4"/><rect x="32" y="14" width="4" height="4"/><rect x="36" y="14" width="4" height="4"/><rect x="40" y="14" width="4" height="4"/><rect x="44" y="14" width="4" height="4"/><rect x="48" y="14" width="4" height="4"/>
      <!-- row 3: cols 0-9 (mouth starts top right) -->
      <rect x="0" y="18" width="4" height="4"/><rect x="4" y="18" width="4" height="4"/><rect x="8" y="18" width="4" height="4"/><rect x="12" y="18" width="4" height="4"/><rect x="16" y="18" width="4" height="4"/><rect x="20" y="18" width="4" height="4"/><rect x="24" y="18" width="4" height="4"/><rect x="28" y="18" width="4" height="4"/>
      <!-- row 4: cols 0-7 -->
      <rect x="0" y="22" width="4" height="4"/><rect x="4" y="22" width="4" height="4"/><rect x="8" y="22" width="4" height="4"/><rect x="12" y="22" width="4" height="4"/><rect x="16" y="22" width="4" height="4"/><rect x="20" y="22" width="4" height="4"/>
      <!-- row 5 (mouth wide open): cols 0-4 -->
      <rect x="0" y="26" width="4" height="4"/><rect x="4" y="26" width="4" height="4"/><rect x="8" y="26" width="4" height="4"/>
      <!-- row 6 center (widest): cols 0-3 -->
      <rect x="0" y="30" width="4" height="4"/><rect x="4" y="30" width="4" height="4"/>
      <!-- row 7: cols 0-4 -->
      <rect x="0" y="34" width="4" height="4"/><rect x="4" y="34" width="4" height="4"/><rect x="8" y="34" width="4" height="4"/>
      <!-- row 8: cols 0-7 -->
      <rect x="0" y="38" width="4" height="4"/><rect x="4" y="38" width="4" height="4"/><rect x="8" y="38" width="4" height="4"/><rect x="12" y="38" width="4" height="4"/><rect x="16" y="38" width="4" height="4"/><rect x="20" y="38" width="4" height="4"/>
      <!-- row 9: cols 0-9 -->
      <rect x="0" y="42" width="4" height="4"/><rect x="4" y="42" width="4" height="4"/><rect x="8" y="42" width="4" height="4"/><rect x="12" y="42" width="4" height="4"/><rect x="16" y="42" width="4" height="4"/><rect x="20" y="42" width="4" height="4"/><rect x="24" y="42" width="4" height="4"/><rect x="28" y="42" width="4" height="4"/>
      <!-- row 10: cols 0-12 -->
      <rect x="0" y="46" width="4" height="4"/><rect x="4" y="46" width="4" height="4"/><rect x="8" y="46" width="4" height="4"/><rect x="12" y="46" width="4" height="4"/><rect x="16" y="46" width="4" height="4"/><rect x="20" y="46" width="4" height="4"/><rect x="24" y="46" width="4" height="4"/><rect x="28" y="46" width="4" height="4"/><rect x="32" y="46" width="4" height="4"/><rect x="36" y="46" width="4" height="4"/><rect x="40" y="46" width="4" height="4"/><rect x="44" y="46" width="4" height="4"/><rect x="48" y="46" width="4" height="4"/>
      <!-- row 11: cols 1-11 -->
      <rect x="4" y="50" width="4" height="4"/><rect x="8" y="50" width="4" height="4"/><rect x="12" y="50" width="4" height="4"/><rect x="16" y="50" width="4" height="4"/><rect x="20" y="50" width="4" height="4"/><rect x="24" y="50" width="4" height="4"/><rect x="28" y="50" width="4" height="4"/><rect x="32" y="50" width="4" height="4"/><rect x="36" y="50" width="4" height="4"/><rect x="40" y="50" width="4" height="4"/><rect x="44" y="50" width="4" height="4"/>
      <!-- row 12: cols 3-9 -->
      <rect x="12" y="54" width="4" height="4"/><rect x="16" y="54" width="4" height="4"/><rect x="20" y="54" width="4" height="4"/><rect x="24" y="54" width="4" height="4"/><rect x="28" y="54" width="4" height="4"/><rect x="32" y="54" width="4" height="4"/><rect x="36" y="54" width="4" height="4"/>
    </g>
    <!-- Eye pixel -->
    <rect x="28" y="14" width="4" height="4" fill="#000"/>
    <rect x="32" y="14" width="4" height="4" fill="#000"/>
  </g>

  <!-- GHOST 1 - Blinky (red) -->
  <g>
