      <rect x="20" y="26" width="4" height="4"/>
      <rect x="28" y="26" width="4" height="4"/><rect x="32" y="26" width="4" height="4"/>
      <!-- body -->
      <rect x="0"  y="30" width="4" height="4"/><rect x="4"  y="30" width="4" height="4"/><rect x="8"  y="30" width="4" height="4"/><rect x="12" y="30" width="4" height="4"/><rect x="16" y="30" width="4" height="4"/><rect x="20" y="30" width="4" height="4"/><rect x="24" y="30" width="4" height="4"/><rect x="28" y="30" width="4" height="4"/><rect x="32" y="30" width="4" height="4"/>
      <rect x="0"  y="34" width="4" height="4"/><rect x="4"  y="34" width="4" height="4"/><rect x="8"  y="34" width="4" height="4"/><rect x="12" y="34" width="4" height="4"/><rect x="16" y="34" width="4" height="4"/><rect x="20" y="34" width="4" height="4"/><rect x="24" y="34" width="4" height="4"/><rect x="28" y="34" width="4" height="4"/><rect x="32" y="34" width="4" height="4"/>
      <rect x="0"  y="38" width="4" height="4"/><rect x="4"  y="38" width="4" height="4"/><rect x="8"  y="38" width="4" height="4"/><rect x="12" y="38" width="4" height="4"/><rect x="16" y="38" width="4" height="4"/><rect x="20" y="38" width="4" height="4"/><rect x="24" y="38" width="4" height="4"/><rect x="28" y="38" width="4" height="4"/><rect x="32" y="38" width="4" height="4"/>
      <rect x="0"  y="42" width="4" height="4"/><rect x="4"  y="42" width="4" height="4"/><rect x="8"  y="42" width="4" height="4"/><rect x="12" y="42" width="4" height="4"/><rect x="16" y="42" width="4" height="4"/><rect x="20" y="42" width="4" height="4"/><rect x="24" y="42" width="4" height="4"/><rect x="28" y="42" width="4" height="4"/><rect x="32" y="42" width="4" height="4"/>
      <!-- bottom fringe -->
      <rect x="0"  y="46" width="4" height="4"/><rect x="4"  y="46" width="4" height="4"/>
      <rect x="12" y="46" width="4" height="4"/><rect x="16" y="46" width="4" height="4"/>
      <rect x="24" y="46" width="4" height="4"/><rect x="28" y="46" width="4" height="4"/>
    </g>
    <!-- white eyes -->
    <rect x="8"  y="22" width="12" height="8" fill="white"/>
    <rect x="20" y="22" width="8"  height="8" fill="white"/>
    <!-- pupils (blue, looking left) -->
    <rect x="8"  y="24" width="4" height="4" fill="#00F"/>
    <rect x="20" y="24" width="4" height="4" fill="#00F"/>
